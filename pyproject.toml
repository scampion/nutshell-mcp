[project]
name = "territorial-mcp"
version = "0.2.0"
description = "Serveur MCP de données territoriales européennes (Eurostat, Copernicus, OSM) — grain unifié zone × indicateur × période, mode offline total"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "httpx>=0.27",
  "pyarrow>=17",
  "duckdb>=1.0",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
osm = ["shapely>=2", "pyproj>=3.6"]
copernicus = ["cdsapi>=0.7", "xarray>=2024.1", "netCDF4>=1.6", "exactextract>=0.2", "rasterio>=1.3", "geopandas>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
territorial-mcp = "territorial_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["territorial_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: test nécessitant un accès réseau (désélectionné par défaut avec -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Jeu de règles explicite : la CI ne doit pas dépendre du défaut de la version
# de ruff installée. Les `except Exception` sont voulus (§7 : un échec
# d'indicateur n'interrompt pas le lot), BLE n'est donc pas retenu.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # Field(...) en valeur par défaut : idiome pydantic
  "RUF001",  # apostrophes typographiques dans les messages français
  "RUF002",
  "RUF003",
]
