id: schools_count
label: "Établissements scolaires (comptage OSM)"
unit: COUNT
source: osm
frequency: SNAPSHOT
geo_levels: [NUTS2, NUTS3, CITY]
nuts_vintage: 2024
description: >-
  Nombre d'objets OpenStreetMap tagués amenity=school dans la zone.
  Matérialisé par le pipeline OSM (lot 2).
extraction:
  tags:
    - key: amenity
      value: school
  # Sur le Luxembourg (spike) : 352 way + 34 node + 7 relation (campus
  # multipolygones). Omettre "relation" sous-compterait ~2 % des écoles.
  geometry: [node, way, relation]
  aggregation: count
